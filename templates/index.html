<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bygger och renoverar i Sthlm</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 0 15px; color: #fff; background-color: #1a1d24; }
        h2 { text-align: center; color: #4a90e2; }
        form { background: #222631; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); border: 1px solid #2f3542; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; color: #b2bec3; font-size: 14px; }
        select, input, textarea { width: 100%; padding: 12px; box-sizing: border-box; background-color: #1e222b; border: 1px solid #3a4150; border-radius: 6px; font-size: 16px; color: #fff; }
        select:focus, input:focus, textarea:focus { border-color: #4a90e2; outline: none; }
        button { background-color: #3498db; color: white; padding: 14px; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; transition: background 0.2s; }
        button:hover { background-color: #2980b9; }
    </style>
</head>
<body>

    <form id="shift-form">
        <h2 style="margin-top: 0; margin-bottom: 20px;">Bygger och renoverar i Sthlm</h2>

        <div class="form-group">
            <label for="date">Дата смены:</label>
            <input type="date" id="date" name="date" required>
        </div>

        <div class="form-group">
            <label for="employee">Сотрудник:</label>
            <select id="employee" name="employee" required>
                <option value="">-- Выберите ваше имя --</option>
                {% for emp in employees %}
                <option value="{{ emp }}">{{ emp }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="company">Фирма (Заказчик):</label>
            <select id="company" name="company" required>
                {% for comp in companies %}
                <option value="{{ comp }}">{{ comp }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="object_name">Объект / Адрес:</label>
            <select id="object_name" name="object_name" required>
                {% for obj in objects %}
                <option value="{{ obj }}">{{ obj }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="hours">Отработано часов:</label>
            <input type="number" step="0.5" id="hours" name="hours" value="8.0" required>
        </div>

        <div class="form-group" style="display: flex; align-items: center; gap: 10px;">
            <input type="checkbox" id="transport_check" style="width: 20px; height: 20px; cursor: pointer;">
            <label for="transport_check" style="margin-bottom: 0; cursor: pointer; color: #fff;">Транспорт (учитывать поездку)</label>
            <input type="hidden" id="transport" name="transport" value="0.0">
        </div>

        <div class="form-group">
            <label for="comment">Описание выполненных работ:</label>
            <textarea id="comment" name="comment" rows="3" placeholder="Что было сделано за смену..."></textarea>
        </div>

        <button type="submit">Отправить смену</button>
    </form>

    <!-- ОТДЕЛЬНЫЙ БЕЗОПАСНЫЙ БЛОК ДЛЯ ПРОВЕРКИ ИСТОРИИ -->
    <div style="margin-top: 25px; background: #222631; padding: 20px; border-radius: 12px; border: 1px solid #2f3542; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">
        <h3 style="color: #4a90e2; margin-top: 0; font-size: 16px; margin-bottom: 12px;">🔍 История смен сотрудника</h3>
        
        <div style="margin-bottom: 12px;">
            <select id="safe-employee" style="width: 100%; padding: 12px; background-color: #1e222b; border: 1px solid #3a4150; border-radius: 6px; color: #fff; font-size: 16px;">
                <option value="">-- Выберите сотрудника --</option>
                {% for emp in employees %}
                <option value="{{ emp }}">{{ emp }}</option>
                {% endfor %}
            </select>
        </div>
        
        <button type="button" id="safe-btn" style="background-color: #27ae60; color: white; padding: 12px; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold;">Показать смены</button>
        
        <div id="safe-result" style="margin-top: 15px; display: none; background: #1a2332; padding: 12px; border-radius: 6px; border: 1px solid #2e5b88;">
            <h4 style="margin-top: 0; margin-bottom: 8px; color: #64b5f6; font-size: 14px;">Последние смены:</h4>
            <ul id="safe-list" style="padding-left: 20px; margin: 0; font-size: 13px; color: #dfe6e9;"></ul>
        </div>
    </div>

    <script>
        // Ставим сегодняшнюю дату по умолчанию
        document.getElementById('date').valueAsDate = new Date();

        // Логика чекбокса транспорта
        document.getElementById('transport_check').addEventListener('change', function() {
            document.getElementById('transport').value = this.checked ? 1.0 : 0.0;
        });

        // Отправка данных основной смены
        document.getElementById('shift-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = {
                date: document.getElementById('date').value,
                employee: document.getElementById('employee').value,
                company: document.getElementById('company').value,
                object_name: document.getElementById('object_name').value,
                hours: parseFloat(document.getElementById('hours').value),
                transport: parseFloat(document.getElementById('transport').value || 0),
                comment: document.getElementById('comment').value
            };

            try {
                const response = await fetch('/submit-shift', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json();
                if (response.ok) {
                    alert(result.message);
                    document.getElementById('comment').value = '';
                } else {
                    alert("Ошибка: " + result.message);
                }
            } catch (err) {
                alert("Не удалось отправить данные на сервер.");
                console.error(err);
            }
        });

        // Логика отдельной кнопки проверки истории
        document.getElementById('safe-btn').addEventListener('click', async function() {
            const emp = document.getElementById('safe-employee').value;
            const container = document.getElementById('safe-result');
            const list = document.getElementById('safe-list');
            
            list.innerHTML = '';
            if (!emp) {
                alert('Выберите сотрудника из списка!');
                return;
            }

            try {
                const response = await fetch('/check-employee-shifts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ employee: emp })
                });
                
                const data = await response.json();
                
                if (data.recent_shifts && data.recent_shifts.length > 0) {
                    data.recent_shifts.forEach(shift => {
                        const li = document.createElement('li');
                        li.textContent = `${shift.date} — ${shift.object_name} (${shift.hours} ч)`;
                        list.appendChild(li);
                    });
                    container.style.display = 'block';
                } else {
                    list.innerHTML = '<li>У этого сотрудника пока нет сохраненных смен.</li>';
                    container.style.display = 'block';
                }
            } catch (err) {
                alert("Ошибка связи с сервером.");
                console.error(err);
            }
        });
    </script>
</body>
</html>
