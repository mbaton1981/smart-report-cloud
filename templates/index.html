<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bygger och renoverar i Sthlm</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; padding: 0 15px; color: #2d3436; background-color: #f0f2f5; }
        h2 { text-align: center; color: #1b6ca8; font-size: 24px; margin-bottom: 20px; }
        .main-container { display: flex; flex-wrap: wrap; gap: 20px; }
        
        .form-box { flex: 1; min-width: 320px; background: #ffffff; padding: 22px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border: 1px solid #dcdde1; }
        .history-box { flex: 1; min-width: 320px; background: #ffffff; padding: 22px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border: 1px solid #dcdde1; height: fit-content; }
        
        .form-group { margin-bottom: 18px; }
        
        label { display: block; margin-bottom: 7px; font-weight: bold; color: #2f3640; font-size: 15px; }
        
        select, input, textarea { 
            width: 100%; 
            padding: 12px; 
            box-sizing: border-box; 
            background-color: #f8f9fa; 
            border: 1px solid #b2bec3; 
            border-radius: 6px; 
            font-size: 16px; 
            color: #2d3436; 
        }
        select:focus, input:focus, textarea:focus { border-color: #0984e3; background-color: #fff; outline: none; box-shadow: 0 0 0 3px rgba(9, 132, 227, 0.15); }
        
        input[type="date"], input[type="month"] {
            color-scheme: light;
        }

        button { background-color: #0984e3; color: white; padding: 14px; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; transition: background 0.2s; }
        button:hover { background-color: #0765b7; }
        .btn-history { background-color: #00b894; margin-top: 10px; }
        .btn-history:hover { background-color: #00a884; }
        .btn-print { background-color: #e67e22; margin-top: 10px; display: none; }
        .btn-print:hover { background-color: #d35400; }
        
        #history-list { 
            list-style-type: none; 
            padding: 0; 
            margin: 0; 
            max-height: 280px; 
            overflow-y: auto; 
        }
        #history-list li { background: #f1f2f6; margin-bottom: 8px; padding: 12px; border-radius: 6px; border: 1px solid #dcdde1; font-size: 14px; color: #2d3436; display: flex; justify-content: space-between; align-items: center; }

        /* Уведомления формы */
        #form-alert { display: none; margin-top: 15px; padding: 12px; border-radius: 6px; text-align: center; font-weight: bold; font-size: 15px; }
        #form-alert.success { background: #00b894; color: #fff; }
        #form-alert.error { background: #d63031; color: #fff; }

        /* Модальное окно авторизации */
        #login-modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); z-index: 100; display: flex; align-items: center; justify-content: center; }
        #login-modal.hidden { display: none; }
        .login-card { background: #ffffff; padding: 30px; border-radius: 12px; width: 100%; max-width: 380px; border: 1px solid #dcdde1; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        
        /* Шапка пользователя */
        .user-header { background: #ffffff; padding: 12px 18px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #dcdde1; display: flex; justify-content: space-between; align-items: center; font-size: 15px; color: #2d3436; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .btn-logout { background: #d63031; width: auto; padding: 8px 14px; font-size: 14px; }
        .btn-logout:hover { background: #c0392b; }

        /* Скрытая область для печати/PDF */
        #print-area { display: none; }

        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; display: block !important; background: #fff; color: #000; padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- МОДАЛЬНОЕ ОКНО ВХОДА -->
    <div id="login-modal" class="hidden">
        <div class="login-card">
            <h3 style="color: #0984e3; margin-top: 0; text-align: center; margin-bottom: 20px; font-size: 20px;">🔐 Вход в систему</h3>
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="login-username">Логин:</label>
                    <select id="login-username" required>
                        <option value="">-- Загрузка пользователей... --</option>
                        <option value="admin">admin (Администратор)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="login-password">Пароль:</label>
                    <input type="password" id="login-password" required placeholder="••••••••">
                </div>
                <div id="login-error" style="color: #d63031; font-size: 14px; margin-bottom: 15px; display: none;"></div>
                <button type="submit">Войти</button>
            </form>
        </div>
    </div>

    <h2>Bygger och renoverar i Sthlm</h2>

    <div class="container" style="max-width: 800px; margin: 0 auto;">
        <div class="user-header">
            <span id="user-info-text">Загрузка сессии...</span>
            <button type="button" class="btn-logout" onclick="handleLogout()">Выйти</button>
        </div>
    </div>

    <div class="main-container">
        <!-- ЛЕВАЯ КОЛОНКА: Основная форма отправки смены -->
        <div class="form-box">
            <h3 style="color: #0984e3; margin-top: 0; font-size: 18px; margin-bottom: 18px;">📝 Отправить смену</h3>
            <form id="shift-form">
                <div class="form-group">
                    <label for="date">Дата смены:</label>
                    <input type="date" id="date" name="date" required>
                </div>

                <div class="form-group">
                    <label for="employee">Сотрудник:</label>
                    <select id="employee" name="employee" required>
                        <option value="">-- Выберите ваше имя --</option>
                        {% for emp in employees %}
                        <option value="{{ emp }}">{{ emp }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="company">Фирма (Заказчик):</label>
                    <select id="company" name="company" required onchange="filterObjects()">
                        {% for comp in companies %}
                        <option value="{{ comp }}">{{ comp }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="object_name">Объект / Адрес:</label>
                    <select id="object_name" name="object_name" required>
                        <!-- Заполняется динамически через JS -->
                    </select>
                </div>

                <div class="form-group">
                    <label for="hours">Отработано часов:</label>
                    <input type="number" step="0.5" id="hours" name="hours" value="8.0" required>
                </div>

                <div class="form-group" style="display: flex; align-items: center; gap: 12px;">
                    <input type="checkbox" id="transport_check" style="width: 22px; height: 22px; cursor: pointer;">
                    <label for="transport_check" style="margin-bottom: 0; cursor: pointer; color: #2d3436; font-size: 15px;">Транспорт (учитывать поездку)</label>
                    <input type="hidden" id="transport" name="transport" value="0.0">
                </div>

                <div class="form-group">
                    <label for="comment">Описание выполненных работ:</label>
                    <textarea id="comment" name="comment" rows="3" placeholder="Что было сделано за смену..."></textarea>
                </div>

                <button type="submit">Отправить смену</button>
            </form>

            <div id="form-alert"></div>
        </div>

        <!-- ПРАВАЯ КОЛОНКА: Блок просмотра истории -->
        <div class="history-box">
            <h3 style="color: #0984e3; margin-top: 0; font-size: 18px; margin-bottom: 18px;">🔍 Проверка истории смен</h3>
            
            <div class="form-group">
                <label for="history-month">Выберите месяц:</label>
                <input type="month" id="history-month" class="form-control">
            </div>

            <div class="form-group">
                <label for="history-employee">Выберите сотрудника:</label>
                <select id="history-employee">
                    <option value="">-- Выберите сотрудника --</option>
                    {% for emp in employees %}
                    <option value="{{ emp }}">{{ emp }}</option>
                    {% endfor %}
                </select>
            </div>

            <button type="button" id="load-history-btn" class="btn-history">Показать смены за месяц</button>
            <button type="button" id="print-report-btn" class="btn-print" onclick="window.print()">🖨️ Печать / Сохранить в PDF</button>

            <div id="warning-container" style="margin-top: 15px; display: none; background: #ffeaa7; border: 1px solid #fdcb6e; padding: 12px; border-radius: 6px; font-size: 14px; color: #d63031; font-weight: bold;"></div>

            <div style="margin-top: 18px;">
                <h4 style="color: #0984e3; font-size: 15px; margin-bottom: 10px;">Заполненные дни за месяц:</h4>
                <ul id="history-list">
                    <li style="color: #636e72; justify-content: center;">Выберите месяц, сотрудника и нажмите кнопку</li>
                </ul>
            </div>
        </div>
    </div>

    <!-- СКРЫТАЯ ОБЛАСТЬ ДЛЯ ПЕЧАТИ И PDF -->
    <div id="print-area">
        <h2 style="text-align: center; color: #000;">Bygger och renoverar i Sthlm</h2>
        <h3 id="print-title" style="text-align: center; margin-bottom: 20px; color: #333;">Arbetsdagbok (Rapport)</h3>
        <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 14px;">
            <thead>
                <tr style="border-bottom: 2px solid #000; text-align: left;">
                    <th style="padding: 8px;">Datum</th>
                    <th style="padding: 8px;">Objekt / Arbetsbeskrivning</th>
                    <th style="padding: 8px; text-align: right;">Timmar</th>
                </tr>
            </thead>
            <tbody id="print-table-body">
                <!-- Заполняется динамически -->
            </tbody>
        </table>
        <div style="margin-top: 15px; border-top: 1px dashed #666; padding-top: 10px;" id="print-summary">
            <!-- Сводка по объектам -->
        </div>
        <div style="font-size: 16px; font-weight: bold; text-align: right; border-top: 2px solid #000; padding-top: 10px; margin-top: 10px;" id="print-total-hours">
            <!-- Общий итог -->
        </div>
    </div>

    <!-- Скрипты -->
    <script>
        const allObjects = {{ objects | tojson }};
        let currentUser = null;
        document.getElementById('date').value = new Date().toISOString().split('T')[0];
        
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        document.getElementById('history-month').value = `${year}-${month}`;

        document.getElementById('transport_check').addEventListener('change', function() {
            document.getElementById('transport').value = this.checked ? 1.0 : 0.0;
        });

        // Функция автоматического перевода комментариев на шведский язык через публичный API
        async function translateToSwedish(text) {
            if (!text || text.trim() === "") return "";
            try {
                const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=ru|sv`;
                const res = await fetch(url);
                const data = await res.json();
                if (data && data.responseData && data.responseData.translatedText) {
                    let translated = data.responseData.translatedText;
                    if (!translated.includes("MYMEMORY WARNING")) {
                        return translated;
                    }
                }
            } catch (e) {
                console.error("Ошибка перевода:", e);
            }
            return text; // Возвращаем оригинал в случае ошибки сети
        }

        function showFormAlert(message, type) {
            const alertBox = document.getElementById('form-alert');
            alertBox.textContent = message;
            alertBox.className = type;
            alertBox.style.display = 'block';

            setTimeout(() => {
                alertBox.style.display = 'none';
            }, 3500);
        }

        function filterObjects() {
            const selectedCompany = document.getElementById('company').value;
            const objectSelect = document.getElementById('object_name');
            objectSelect.innerHTML = '';

            const filtered = allObjects.filter(obj => obj.company === selectedCompany);

            if (filtered.length === 0) {
                const opt = document.createElement('option');
                opt.value = "";
                opt.textContent = "-- Нет объектов для этой фирмы --";
                objectSelect.appendChild(opt);
            } else {
                filtered.forEach(obj => {
                    const opt = document.createElement('option');
                    opt.value = obj.name;
                    opt.textContent = obj.display;
                    objectSelect.appendChild(opt);
                });
            }
        }

        async function loadLoginUsers() {
            try {
                const response = await fetch('/get-active-employees');
                const data = await response.json();
                if (data.ok) {
                    const select = document.getElementById('login-username');
                    select.innerHTML = '<option value="">-- Выберите пользователя --</option>';
                    
                    const adminOpt = document.createElement('option');
                    adminOpt.value = 'admin';
                    adminOpt.textContent = 'admin (Администратор)';
                    select.appendChild(adminOpt);

                    data.employees.forEach(name => {
                        const opt = document.createElement('option');
                        opt.value = name;
                        opt.textContent = name;
                        select.appendChild(opt);
                    });
                }
            } catch (err) {
                console.error("Ошибка загрузки пользователей:", err);
            }
        }

        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        async function checkAuth() {
            try {
                const res = await fetch('/me');
                const data = await res.json();
                if (data.ok) {
                    currentUser = data.user;
                    document.getElementById('login-modal').classList.add('hidden');
                    setupUserInterface();
                } else {
                    showLoginModal();
                }
            } catch (e) {
                showLoginModal();
            }
        }

        function showLoginModal() {
            loadLoginUsers();
            document.getElementById('login-modal').classList.remove('hidden');
        }

        function setupUserInterface() {
            const userInfoText = document.getElementById('user-info-text');
            const employeeSelect = document.getElementById('employee');
            const historyEmployeeSelect = document.getElementById('history-employee');

            if (currentUser.role === 'admin') {
                userInfoText.innerHTML = `👤 Администратор: <b>${currentUser.username}</b>`;
                employeeSelect.disabled = false;
                historyEmployeeSelect.disabled = false;
            } else {
                userInfoText.innerHTML = `👷 Работник: <b>${currentUser.username}</b>`;
                
                const userName = currentUser.username.trim().toLowerCase();
                const allEmployeeOptions = Array.from(employeeSelect.options).map(opt => opt.value).filter(val => val !== "");
                
                let matchedName = currentUser.username;
                for (const emp of allEmployeeOptions) {
                    const empLower = emp.trim().toLowerCase();
                    if (empLower === userName || empLower.includes(userName) || userName.includes(empLower)) {
                        matchedName = emp;
                        break;
                    }
                }

                [employeeSelect, historyEmployeeSelect].forEach(select => {
                    select.innerHTML = '';
                    const opt = document.createElement('option');
                    opt.value = matchedName;
                    opt.textContent = matchedName;
                    select.appendChild(opt);
                    select.value = matchedName;
                });
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;
            const errDiv = document.getElementById('login-error');

            errDiv.style.display = 'none';

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (data.ok) {
                    currentUser = data.user;
                    document.getElementById('login-modal').classList.add('hidden');
                    setupUserInterface();
                } else {
                    errDiv.textContent = data.error || 'Неверный логин или пароль';
                    errDiv.style.display = 'block';
                }
            } catch (err) {
                errDiv.textContent = 'Ошибка соединения с сервером';
                errDiv.style.display = 'block';
            }
        }

        async function handleLogout() {
            await fetch('/logout', { method: 'POST' });
            window.location.reload();
        }

        document.getElementById('shift-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = {
                request_id: generateUUID(),
                date: document.getElementById('date').value,
                employee: document.getElementById('employee').value,
                company: document.getElementById('company').value,
                object_name: document.getElementById('object_name').value,
                hours: parseFloat(document.getElementById('hours').value),
                transport: parseFloat(document.getElementById('transport').value || 0),
                comment: document.getElementById('comment').value
            };

            try {
                const response = await fetch('/submit-shift', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json();
                if (response.ok) {
                    showFormAlert("Смена успешно отправлена!", "success");
                    document.getElementById('comment').value = '';
                } else {
                    showFormAlert("Ошибка: " + (result.error || result.message || "Не удалось отправить"), "error");
                }
            } catch (err) {
                showFormAlert("Не удалось отправить данные на сервер.", "error");
                console.error(err);
            }
        });

        document.getElementById('load-history-btn').addEventListener('click', async function() {
            const empName = document.getElementById('history-employee').value;
            const selectedMonth = document.getElementById('history-month').value;
            const listContainer = document.getElementById('history-list');
            const warningContainer = document.getElementById('warning-container');
            const printBtn = document.getElementById('print-report-btn');
            
            if (!empName) {
                alert('Пожалуйста, выберите сотрудника!');
                return;
            }
            if (!selectedMonth) {
                alert('Пожалуйста, выберите месяц!');
                return;
            }

            listContainer.innerHTML = '<li style="color: #636e72; justify-content: center;">Загрузка...</li>';
            warningContainer.style.display = 'none';
            warningContainer.textContent = '';
            printBtn.style.display = 'none';

            try {
                const shiftsRes = await fetch('/check-employee-shifts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ employee: empName, month: selectedMonth })
                });
                const shiftsData = await shiftsRes.json();

                const missingRes = await fetch('/check-missing-shifts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ employee: empName })
                });
                const missingData = await missingRes.json();

                if (missingData.ok && missingData.has_gaps) {
                    warningContainer.textContent = missingData.message + " Пропущенные даты: " + missingData.missing_days.join(', ');
                    warningContainer.style.display = 'block';
                }

                listContainer.innerHTML = '';
                let totalHours = 0;
                let totalsByObject = {};

                if (shiftsData.recent_shifts && shiftsData.recent_shifts.length > 0) {
                    // Массив для хранения строк отчета (чтобы дождаться асинхронного перевода)
                    let printRowsData = [];

                    for (const shift of shiftsData.recent_shifts) {
                        const li = document.createElement('li');
                        const markingBadge = shift.marking ? `<b style="margin-right: 6px;">[${shift.marking}]</b>` : '';
                        
                        let badgeStyle = "background: #e1f5fe; color: #0277bd;";
                        if (shift.marking === 'p1000') {
                            badgeStyle = "background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9;";
                        } else if (shift.marking === 'p1001') {
                            badgeStyle = "background: #ffebee; color: #c62828; border: 1px solid #ffcdd2;";
                        }
                        
                        li.innerHTML = `<span><b>${shift.date}</b><br><small style="color: #636e72;">${markingBadge}${shift.object_name}</small></span>` +
                                       `<span style="${badgeStyle} padding: 5px 10px; border-radius: 4px; font-weight: bold;">${shift.hours} ч</span>`;
                        listContainer.appendChild(li);

                        // Суммируем часы по объектам для сводки
                        let objKey = shift.object_name;
                        if (shift.marking) {
                            objKey = `[${shift.marking}] ${objKey}`;
                        }
                        totalsByObject[objKey] = (totalsByObject[objKey] || 0) + shift.hours;
                        totalHours += shift.hours;

                        // Автоматически переводим описание/комментарий на шведский для печатного отчета
                        let rawComment = shift.comment || "";
                        let translatedComment = rawComment;
                        if (rawComment.trim() !== "") {
                            translatedComment = await translateToSwedish(rawComment);
                        }

                        let objDisplay = shift.object_name;
                        if (shift.marking) {
                            objDisplay = `[${shift.marking}] ${objDisplay}`;
                        }
                        if (translatedComment) {
                            objDisplay += ` — ${translatedComment}`;
                        }

                        printRowsData.push({
                            date: shift.date,
                            description: objDisplay,
                            hours: shift.hours
                        });
                    }

                    // Формируем HTML таблицы для печати из переведенных данных
                    let printTableHtml = '';
                    printRowsData.forEach(row => {
                        printTableHtml += `<tr style="border-bottom: 1px solid #ddd;">
                            <td style="padding: 8px;">${row.date}</td>
                            <td style="padding: 8px;">${row.description}</td>
                            <td style="padding: 8px; text-align: right; font-weight: bold;">${row.hours} tim</td>
                        </tr>`;
                    });

                    // Формируем блок сводки по объектам на шведском
                    let summaryHtml = '<b>Totalt per objekt / typ:</b><ul style="margin: 5px 0 0 20px; padding: 0; font-size: 13px;">';
                    for (let [obj, hrs] of Object.entries(totalsByObject)) {
                        summaryHtml += `<li>${obj}: <b>${hrs} tim</b></li>`;
                    }
                    summaryHtml += '</ul>';

                    // Показываем кнопку печати/PDF и заполняем данные
                    printBtn.style.display = 'block';
                    document.getElementById('print-title').textContent = `Arbetsdagbok: ${empName} (${selectedMonth})`;
                    document.getElementById('print-table-body').innerHTML = printTableHtml;
                    document.getElementById('print-summary').innerHTML = summaryHtml;
                    document.getElementById('print-total-hours').textContent = `Totalt antal timmar: ${totalHours} tim`;

                } else {
                    listContainer.innerHTML = '<li style="color: #636e72; justify-content: center;">За этот месяц нет записей о сменах.</li>';
                }
            } catch (err) {
                listContainer.innerHTML = '<li style="color: #d63031; justify-content: center;">Ошибка загрузки данных.</li>';
                console.error(err);
            }
        });

        window.onload = () => {
            filterObjects();
            checkAuth();
        };
    </script>
</body>
</html>
