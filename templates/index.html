<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учет смен — Bygger och renoverar</title>
    <!-- Tailwind CSS CDN для быстрой и красивой верстки -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col justify-between font-sans text-gray-800">

    <!-- Окно авторизации (скрыто, если пользователь уже вошел) -->
    <div id="login-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-lg shadow-xl p-8 max-w-md w-full mx-4">
            <h2 class="text-2xl font-bold text-gray-900 mb-6 text-center">Вход в систему</h2>
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Логин</label>
                    <input type="text" id="login-username" required 
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                           placeholder="Например: aliaksei.patonich">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Пароль</label>
                    <input type="password" id="login-password" required 
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                           placeholder="••••••••">
                </div>
                <div id="login-error" class="text-red-500 text-sm hidden"></div>
                <button type="submit" 
                        class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition font-medium">
                    Войти
                </button>
            </form>
        </div>
    </div>

    <!-- Основной интерфейс -->
    <div class="container mx-auto px-4 py-8 max-w-2xl flex-grow">
        <!-- Шапка -->
        <div class="bg-white rounded-lg shadow-md p-4 mb-6 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold text-gray-800">Учет рабочего времени</h1>
                <p id="user-info-text" class="text-sm text-gray-500">Загрузка...</p>
            </div>
            <button onclick="handleLogout()" class="text-sm bg-gray-200 hover:bg-gray-300 px-3 py-1.5 rounded transition text-gray-700">
                Выйти
            </button>
        </div>

        <!-- Форма отправки смены -->
        <div class="bg-white rounded-lg shadow-md p-6">
            <form id="shift-form" onsubmit="submitShift(event)" class="space-y-4">
                <!-- Дата -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Дата</label>
                    <input type="date" id="date" required 
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- Сотрудник -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Сотрудник</label>
                    <select id="employee" required 
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                        {% for emp in employees %}
                        <option value="{{ emp }}">{{ emp }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Фирма -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Фирма</label>
                    <select id="company" onchange="filterObjects()" required 
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                        {% for comp in companies %}
                        <option value="{{ comp }}">{{ comp }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Объект -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Объект</label>
                    <select id="object_name" required 
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                        <!-- Динамически фильтруется по выбранной фирме -->
                    </select>
                </div>

                <!-- Часы -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Часы (0.5 - 24)</label>
                    <input type="number" id="hours" step="0.5" min="0.5" max="24" value="8" required 
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- Транспорт -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Транспорт (км / доплата)</label>
                    <input type="number" id="transport" step="1" min="0" value="0" 
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- Комментарий -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Комментарий</label>
                    <textarea id="comment" rows="2" 
                              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                              placeholder="Описание выполненных работ..."></textarea>
                </div>

                <!-- Статус отправки -->
                <div id="form-message" class="text-sm font-medium hidden"></div>

                <!-- Кнопка отправки -->
                <button type="submit" 
                        class="w-full bg-green-600 text-white py-3 px-4 rounded-md hover:bg-green-700 transition font-medium text-lg">
                    Отправить смену
                </button>
            </form>
        </div>
    </div>

    <!-- Передаем список объектов из Flask в JS -->
    <script>
        const allObjects = {{ objects | tojson }};
        let currentUser = null;

        // Установка сегодняшней даты по умолчанию
        document.getElementById('date').valueAsDate = new Date();

        // Фильтрация объектов при изменении фирмы
        function filterObjects() {
            const selectedCompany = document.getElementById('company').value;
            const objectSelect = document.getElementById('object_name');
            objectSelect.innerHTML = '';

            const filtered = allObjects.filter(obj => obj.company === selectedCompany);
            
            if (filtered.length === 0) {
                // Если у фирмы нет объектов, показываем общие или заглушку
                const opt = document.createElement('option');
                opt.value = "Основной объект";
                opt.textContent = "Основной объект";
                objectSelect.appendChild(opt);
            } else {
                filtered.forEach(obj => {
                    const opt = document.createElement('option');
                    opt.value = obj.name;
                    opt.textContent = obj.display;
                    objectSelect.appendChild(opt);
                });
            }
        }

        // Проверка авторизации при загрузке страницы
        async function checkAuth() {
            try {
                const res = await fetch('/me');
                const data = await res.json();
                if (data.ok) {
                    currentUser = data.user;
                    document.getElementById('login-modal').classList.add('hidden');
                    setupUserInterface();
                } else {
                    showLoginModal();
                }
            } catch (e) {
                showLoginModal();
            }
        }

        function showLoginModal() {
            document.getElementById('login-modal').classList.remove('hidden');
        }

        // Настройка интерфейса в зависимости от роли пользователя
        function setupUserInterface() {
            const userInfoText = document.getElementById('user-info-text');
            const employeeSelect = document.getElementById('employee');

            if (currentUser.role === 'admin') {
                userInfoText.textContent = `Администратор: ${currentUser.username}`;
                // Админ может выбирать любого сотрудника
                employeeSelect.disabled = false;
            } else {
                userInfoText.textContent = `Работник: ${currentUser.username}`;
                
                // Находим ID или имя сотрудника, привязанного к юзеру
                // Если employee_id задан, ищем в списке точное совпадение
                // Либо блокируем селект и ставим имя текущего пользователя
                employeeSelect.disabled = true;
                
                // Пробуем найти соответствие по имени (так как логин часто совпадает с именем или частью имени)
                for (let i = 0; i < employeeSelect.options.length; i++) {
                    const optVal = employeeSelect.options[i].value.toLowerCase();
                    if (optVal.includes(currentUser.username.toLowerCase().replace('.', ' '))) {
                        employeeSelect.selectedIndex = i;
                        break;
                    }
                }
            }
            filterObjects();
        }

        // Обработка входа
        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;
            const errDiv = document.getElementById('login-error');

            errDiv.classList.add('hidden');

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });
                const data = await res.json();

                if (data.ok) {
                    currentUser = data.user;
                    document.getElementById('login-modal').classList.add('hidden');
                    setupUserInterface();
                } else {
                    errDiv.textContent = data.error || 'Ошибка входа';
                    errDiv.classList.remove('hidden');
                }
            } catch (err) {
                errDiv.textContent = 'Ошибка соединения с сервером';
                errDiv.classList.remove('hidden');
            }
        }

        // Выход из системы
        async function handleLogout() {
            await fetch('/logout', {method: 'POST'});
            window.location.reload();
        }

        // Генерация уникального request_id для защиты от дублей
        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        // Отправка смены
        async function submitShift(e) {
            e.preventDefault();
            const msgDiv = document.getElementById('form-message');
            msgDiv.classList.remove('hidden');
            msgDiv.className = "text-sm font-medium text-blue-600";
            msgDiv.textContent = "Отправка смены...";

            const payload = {
                request_id: generateUUID(),
                date: document.getElementById('date').value,
                employee: document.getElementById('employee').value,
                company: document.getElementById('company').value,
                object_name: document.getElementById('object_name').value,
                hours: parseFloat(document.getElementById('hours').value),
                transport: parseFloat(document.getElementById('transport').value) || 0.0,
                comment: document.getElementById('comment').value
            };

            try {
                const res = await fetch('/submit-shift', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (data.ok) {
                    msgDiv.className = "text-sm font-medium text-green-600";
                    msgDiv.textContent = data.message || "Смена успешно сохранена!";
                    document.getElementById('comment').value = '';
                } else {
                    msgDiv.className = "text-sm font-medium text-red-600";
                    msgDiv.textContent = data.error || "Ошибка при отправке";
                }
            } catch (err) {
                msgDiv.className = "text-sm font-medium text-red-600";
                msgDiv.textContent = "Ошибка сети при отправке смены";
            }
        }

        // Инициализация при загрузке
        window.onload = () => {
            filterObjects();
            checkAuth();
        };
    </script>
</body>
</html>
